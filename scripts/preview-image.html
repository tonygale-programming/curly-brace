<style>

  html, body { margin: 0; width: 1200px; height: 630px; background: #e3e4e8; color: #000; }

  .pill { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px 0 18px; border: 2px solid #000; border-radius: 999px; background: #fff; font: 500 22px/1 "IBM Plex Sans", sans-serif; }
  .pill.main { background: #ffbf00; }
  .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  pre { margin: 0; padding: 32px 36px; background: #fff; border: 2px solid #000; border-radius: 18px; font: 400 24px/38px "IBM Plex Mono", monospace; }
  .number-column { color: #6c6f78; margin-right: 22px; }
